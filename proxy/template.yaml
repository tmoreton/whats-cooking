AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Authenticated HTTP API + Lambda proxy for the "What's Cooking?" app. The proxy
  SigV4-signs to the AgentCore runtime. During the auth migration the API serves
  two routes: legacy `POST /invocations` (AWS_IAM + Cognito Identity Pool guest
  creds) for already-shipped app builds, and `POST /v1/invocations` (Cognito User
  Pool JWT authorizer) for new builds that sign users in.

Parameters:
  AgentRuntimeArn:
    Type: String
    Description: ARN of the deployed AgentCore runtime.
    Default: arn:aws:bedrock-agentcore:us-east-1:253170388727:runtime/whats_cooking-iik9UNDwCW
  AgentQualifier:
    Type: String
    Description: Runtime endpoint qualifier.
    Default: DEFAULT

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 1024
    # HTTP API caps integration timeout at 29s; vision calls observed at ~9-18s.
    Timeout: 29
    Tracing: Active
    Environment:
      Variables:
        POWERTOOLS_LOG_LEVEL: INFO

Resources:
  # ---- API ----
  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/http-api/${AWS::StackName}-access'
      RetentionInDays: 14

  ProxyApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowHeaders: ['content-type', 'authorization', 'x-amz-date', 'x-amz-security-token']
        AllowMethods: ['POST', 'OPTIONS']
      # Cap throughput so a runaway client can't run up unbounded Bedrock cost.
      DefaultRouteSettings:
        ThrottlingRateLimit: 5
        ThrottlingBurstLimit: 10
      Auth:
        # Two auth schemes during the migration:
        #  - AWS_IAM: legacy route, callers SigV4-sign with guest creds.
        #  - CognitoJwt: new route, callers send a User Pool ID token as
        #    `Authorization: Bearer <token>`. The audience is the app client id.
        EnableIamAuthorizer: true
        Authorizers:
          CognitoJwt:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience:
                - !Ref UserPoolClient
        # No DefaultAuthorizer: each route sets its own explicitly below.
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","routeKey":"$context.routeKey","status":"$context.status","protocol":"$context.protocol","responseLatency":"$context.responseLatency","authError":"$context.authorizer.error"}'

  # ---- Auth: Cognito User Pool (email + password, self sign-up) ----
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      # Sign in with email address as the username.
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      # Email a 6-digit code for both sign-up confirmation and password reset.
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      EmailConfiguration:
        # Cognito's built-in email (low daily quota; fine for testing). Switch to
        # SES (DEVELOPER) for production sending volume.
        EmailSendingAccount: COGNITO_DEFAULT

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${AWS::StackName}-app'
      UserPoolId: !Ref UserPool
      # Public client (mobile app): no client secret.
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      # Don't leak whether an email is registered on failed sign-in / lookups.
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  # ---- Legacy auth: Cognito Identity Pool with guest (unauthenticated) access.
  # Kept so already-shipped app builds (which SigV4-sign as a guest against the
  # AWS_IAM route) keep working until they're retired. Remove once all clients
  # are on the JWT route. ----
  IdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Sub '${AWS::StackName}-guests'
      AllowUnauthenticatedIdentities: true

  GuestRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-guest-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'cognito-identity.amazonaws.com:aud': !Ref IdentityPool
              'ForAnyValue:StringLike':
                'cognito-identity.amazonaws.com:amr': unauthenticated
      Policies:
        - PolicyName: invoke-recipe-api
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: execute-api:Invoke
                # Least privilege: only the legacy POST /invocations route.
                Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ProxyApi}/*/POST/invocations'

  IdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref IdentityPool
      Roles:
        unauthenticated: !GetAtt GuestRole.Arn

  # ---- Lambda proxy ----
  RecipeProxyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-recipe-proxy'
      CodeUri: src/
      Handler: app.handler
      Environment:
        Variables:
          AGENT_RUNTIME_ARN: !Ref AgentRuntimeArn
          AGENT_QUALIFIER: !Ref AgentQualifier
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock-agentcore:InvokeAgentRuntime
              Resource:
                - !Ref AgentRuntimeArn
                - !Sub '${AgentRuntimeArn}/*'
      Events:
        # Legacy route for already-shipped builds: SigV4 guest creds (AWS_IAM).
        Invoke:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProxyApi
            Path: /invocations
            Method: POST
            Auth:
              Authorizer: AWS_IAM
        # New route for builds that sign users in: Cognito User Pool JWT.
        InvokeJwt:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProxyApi
            Path: /v1/invocations
            Method: POST
            Auth:
              Authorizer: CognitoJwt

  RecipeProxyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-recipe-proxy'
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: EXPO_PUBLIC_API_URL for NEW (JWT) builds — POST /v1/invocations
    Value: !Sub 'https://${ProxyApi}.execute-api.${AWS::Region}.amazonaws.com/v1/invocations'
  LegacyApiUrl:
    Description: Legacy AWS_IAM route used by already-shipped builds — POST /invocations
    Value: !Sub 'https://${ProxyApi}.execute-api.${AWS::Region}.amazonaws.com/invocations'
  UserPoolId:
    Description: EXPO_PUBLIC_USER_POOL_ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: EXPO_PUBLIC_USER_POOL_CLIENT_ID
    Value: !Ref UserPoolClient
  IdentityPoolId:
    Description: Legacy Cognito Identity Pool id (guest creds for old builds)
    Value: !Ref IdentityPool
  AwsRegion:
    Description: EXPO_PUBLIC_AWS_REGION
    Value: !Ref AWS::Region
