name: Build and distribute iOS to TestFlight

jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production

  testflight:
    name: Distribute to TestFlight
    type: testflight
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      # App Store Connect adds builds to auto-distribution groups itself.
      # Explicitly assigning the "Internal" group makes Apple reject the job
      # after the binary has already uploaded and finished processing.
